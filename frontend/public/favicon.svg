<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Inventario Panadería">
  <title>Inventario Panadería</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06a2b"/>
      <stop offset="1" stop-color="#5f2f10"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1ad"/>
      <stop offset="0.55" stop-color="#f4bd6e"/>
      <stop offset="1" stop-color="#d98f3c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Hogaza de pan -->
  <path d="M12 47c0-12.7 9.4-21.5 20-21.5S52 34.3 52 47z"
        fill="url(#crust)" stroke="#6f3b14" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Cortes del pan -->
  <g stroke="#b0701f" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M23 43l5.5-10.5"/>
    <path d="M32 41.5l5.5-11.5"/>
    <path d="M41 43l5-10"/>
  </g>
</svg>
