# Blueprint de Render para el proyecto Panadería Inventario
# Crea 2 servicios: backend PHP (Docker) + frontend React (Static Site)
# La base de datos es PostgreSQL de Supabase, conectada con la variable DATABASE_URL.

services:
  # Backend PHP (API REST) -> https://panaderia-backend.onrender.com
  - type: web
    name: panaderia-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health.php
    envVars:
      # Cadena de conexión de Supabase (Project Settings -> Database -> Connection string -> URI)
      # Al crearlo, deja "sync: false" y pega el valor en el panel de Render (NO se sube al repo).
      - key: DATABASE_URL
        sync: false

  # Frontend React (Static Site) -> https://panaderia-frontend.onrender.com
  - type: web
    name: panaderia-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Ej: https://panaderia-backend.onrender.com/controllers
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta desconocida se sirve con index.html
      - type: rewrite
        source: /*
        destination: /index.html
